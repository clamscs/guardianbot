[package]
name = "guardian-bot"
version = "1.0.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
grammers-client = { version = "0.7", features = ["parse_invite_link"] }
grammers-session = "0.7"
grammers-tl-types = "0.7"
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
tokio = { version = "1", features = ["full"] }
dashmap = "6"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1"
